[project]
name = "ritual"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ethan Zeigler", email = "ethanzeigler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "katsuba",
]

[tool.uv.sources]
katsuba = { git = "https://github.com/vbe0201/katsuba", subdirectory = "src/katsuba-py" }

[project.scripts]
ritual = "ritual:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
